# kgsm-auth-anchor — public vhost fragment, installed into /etc/nginx/conf.d/ by deploy/setup.sh.
#
# The anchor owns its own vhost and nothing else: the :80 ACME challenge block, the certificate
# lifecycle and nginx.conf itself are HOST-level, because a component that claimed them would make
# every other one on this box depend on it.
#
# A person signs in HERE, directly, once, for the whole cluster — so unlike a leaf's unix socket
# this is a public surface, and it needs a name a browser can reach and a certificate for it. The
# daemon itself listens on loopback; TLS is terminated here, the same way every other service on
# this host does it. The name the cluster's DNS anchor gives the accounts capability is served beside
# this one, from the site the anchor generates, through the same proxy rules.

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name auth.thekrystalship.com;

    # One certificate covers every hostname on this box as SANs; the lineage is named for the first
    # one issued.
    ssl_certificate     /etc/letsencrypt/live/kgsm.thekrystalship.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kgsm.thekrystalship.com/privkey.pem;

    include /etc/nginx/kgsm/kgsm-auth-anchor.locations;
}
