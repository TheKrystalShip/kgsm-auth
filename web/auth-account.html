<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/assets/tks-mark.png" />
    <title>Your account</title>
  </head>
  <!-- The account page is the application's alone: signing in is what has to survive without script,
       and changing how you sign in waits for a browser that runs it. -->
  <body data-page="account">
    <div id="floor" class="login-shell">
      <div class="login-shell__inner">
        <div class="login-shell__brand">
          <img src="/assets/tks-mark.png" alt="" />
          <div class="login-shell__brand-name">The Krystal Ship</div>
          <div class="login-shell__tagline">Your account needs JavaScript.</div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/pages/main.jsx"></script>
  </body>
</html>
