<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/assets/tks-mark.png" />
    <title>Sign in</title>
  </head>
  <!-- tks-auth serves this document for the request in flight, which lives behind a cookie, so
       nothing in it is particular to the request. The floor below is a working sign-in: it posts to
       the provider with no script at all, and the provider writes its links at the marker. The
       application replaces it on mount. -->
  <body data-page="sign-in">
    <div id="floor" class="login-shell">
      <div class="login-shell__inner">
        <div class="login-shell__brand">
          <img src="/assets/tks-mark.png" alt="" />
          <div class="login-shell__brand-name">The Krystal Ship</div>
          <div class="login-shell__tagline">Sign in.</div>
        </div>
        <div class="login-card">
          <form class="login-form" method="post" action="/authorize/credentials">
            <label class="login-form__label" for="floor-username">Username</label>
            <input id="floor-username" class="login-form__input" name="username" type="text"
              autocomplete="username" autocapitalize="off" spellcheck="false" required />
            <label class="login-form__label" for="floor-password">Password</label>
            <input id="floor-password" class="login-form__input" name="password" type="password"
              autocomplete="current-password" required />
            <button type="submit" class="login-form__submit">Sign in</button>
          </form>
          <div class="floor-providers"><!--kgsm-floor-providers--></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/pages/main.jsx"></script>
  </body>
</html>
